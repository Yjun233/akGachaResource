name: 抓取国服数据（手动）

# 仅在 GitHub 网页上手动触发，不自动跑。
# 入口：仓库 → Actions → 「抓取国服数据（手动）」→ Run workflow
"on":
  workflow_dispatch:

permissions:
  contents: write               # 需要用 GITHUB_TOKEN 推送

# ⚠️ 五条工作流（主更新 + 皮肤/密录/模组 + 三个单服）**共用同一个并发组** → 互相串行，
#    避免「手动触发」与「定时任务」同时 push 撞车（原先分属两个组，真会撞）。
concurrency:
  group: data-fetch
  cancel-in-progress: false

jobs:
  fetch-sc:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai         # 让提交信息里的日期是北京时间
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 头像要缩到 96×96，需要 Pillow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install pillow

      # 国服（PRTS Wiki）。数据没更新时脚本不会写盘、也不会动 generatedAt。
      - name: 抓取卡池 / 干员数据（国服 · PRTS Wiki）
        run: npm run build:data

      # 头像跟国服放一起：国服 operators.json 一落盘就顺手补齐缺失头像。
      # 只补缺失的头像；CI 能直连 raw.githubusercontent.com，镜像列表置空只走直连。
      - name: 补齐干员头像
        env:
          AVATAR_MIRRORS: ''
        run: npm run build:avatars

      # 顺带把**官方解包数据**里的国服中坚（常驻中坚寻访 + 中坚甄选）也刷一遍。
      # 它自带 `data_version.txt` 短路，版本没变时几乎不耗时。
      # 顺带把国服的模组 / 密录也刷一遍（**国服皮肤不在此列** —— 它走 PRTS）。
      - name: 抓取官方解包数据（国服中坚 + 模组 / 密录）
        continue-on-error: true
        run: npm run build:gamedata -- --servers sc

      # 单服抓取只刷新「本服会改动」的 json：国服产 operators.json / banners_sc.json /
      # banners_cla_sc.json / metadata.json（以及 gamedata 顺带刷的 extras）。
      # 其它服的 json 不在本工作流产出范围，刷它们的缓存既无意义也可能误导，故不刷。
      - uses: ./.github/actions/commit-and-purge
        with:
          prefix: data(sc)
          purge-files: |
            operators.json metadata.json banners_sc.json banners_cla_sc.json
            modules_sc.json memoirs_sc.json
