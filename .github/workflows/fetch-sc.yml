name: 抓取国服数据（手动）

# 仅在 GitHub 网页上手动触发，不自动跑。
# 入口：仓库 → Actions → 「抓取国服数据（手动）」→ Run workflow
"on":
  workflow_dispatch:

permissions:
  contents: write               # 需要用 GITHUB_TOKEN 推送

# 三个单服工作流共用一个并发组，互相串行，避免同时 push 冲突。
concurrency:
  group: data-single-fetch
  cancel-in-progress: false

jobs:
  fetch-sc:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai         # 让提交信息里的日期是北京时间
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 头像要缩到 96×96，需要 Pillow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          npm install
          python -m pip install --upgrade pip
          pip install pillow

      # 国服（PRTS Wiki）。数据没更新时脚本不会写盘、也不会动 generatedAt。
      - name: 抓取卡池 / 干员数据（国服 · PRTS Wiki）
        run: npm run build:data

      # 头像跟国服放一起：国服 operators.json 一落盘就顺手补齐缺失头像。
      # 只补缺失的头像；CI 能直连 raw.githubusercontent.com，镜像列表置空只走直连。
      - name: 补齐干员头像
        env:
          AVATAR_MIRRORS: ''
        run: npm run build:avatars

      - name: 判断有没有实际变化
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::国服数据无更新，不提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::检测到更新："
            git status --short
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data(sc): $(date +%Y-%m-%d) 快照"
          git push

      # 单服抓取只刷新「本服会改动」的 json：国服产 operators.json / banners_sc.json / metadata.json。
      # 其它服的 json 不在本工作流产出范围，刷它们的缓存既无意义也可能误导，故不刷。
      - name: 刷新 jsDelivr 缓存
        if: steps.diff.outputs.changed == 'true'
        run: |
          for f in operators.json banners_sc.json metadata.json; do
            body=$(curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/$f" || echo '{}')
            echo "purge data/$f -> $(echo "$body" | head -c 120)"
          done
