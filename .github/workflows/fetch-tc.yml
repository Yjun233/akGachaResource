name: 抓取繁中服数据（手动）

# 仅在 GitHub 网页上手动触发，不自动跑。
# 入口：仓库 → Actions → 「抓取繁中服数据（手动）」→ Run workflow
"on":
  workflow_dispatch:

permissions:
  contents: write               # 需要用 GITHUB_TOKEN 推送

# ⚠️ 五条工作流（主更新 + 皮肤/密录/模组 + 三个单服）**共用同一个并发组** → 互相串行，
#    避免「手动触发」与「定时任务」同时 push 撞车（原先分属两个组，真会撞）。
concurrency:
  group: data-fetch
  cancel-in-progress: false

jobs:
  fetch-tc:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai         # 让提交信息里的日期是北京时间
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install

      # 繁中服的数据源是金山文档在线表格，靠 AirScript webhook 读，需要 AIRSCRIPT_TOKEN。
      # 令牌没配时跳过而不是失败（否则手动点一次就红，真正要报警的抓取失败反而被淹没）。
      - name: 检查繁中服令牌是否已配置
        id: tc_ready
        env:
          HAS_TC_TOKEN: ${{ secrets.AIRSCRIPT_TOKEN }}
        run: |
          if [ -n "$HAS_TC_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 AIRSCRIPT_TOKEN，跳过繁中服（金山文档）数据"
          fi

      - name: 抓取卡池数据（繁中服 · 金山文档）
        if: steps.tc_ready.outputs.ready == 'true'
        env:
          AIRSCRIPT_TOKEN: ${{ secrets.AIRSCRIPT_TOKEN }}
        run: npm run build:data:tc

      # 顺带把**官方解包数据**里的繁中服中坚也刷一遍（自带 data_version 短路）。
      - name: 抓取官方解包数据（繁中服中坚）
        continue-on-error: true
        run: npm run build:gamedata -- --servers tc

      - name: 判断有没有实际变化
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::繁中服数据无更新，不提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::检测到更新："
            git status --short
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data(tc): $(date +%Y-%m-%d) 快照"
          git push

      # 单服抓取只刷新「本服会改动」的 json：繁中服产 operators.json / banners_tc.json / metadata.json。
      # 其余服的 json（banners_sc / banners_en）不在本工作流产出范围，不刷。
      - name: 刷新 jsDelivr 缓存
        if: steps.diff.outputs.changed == 'true'
        run: |
          for f in operators.json banners_tc.json banners_cla_tc.json metadata.json; do
            body=$(curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/$f" || echo '{}')
            echo "purge data/$f -> $(echo "$body" | head -c 120)"
          done
