name: 更新皮肤与官方解包 extras

# 每周六的**北京时间 13:17** 跑一次（也支持在网页上手动触发）。
#
# ⚠️ 为什么单独一条、而不挂在「更新数据与头像」里：
#    这两块与「卡池」无关，一周更新一次足够；拆出来还能单独重跑，不会牵连卡池数据。
# ⚠️ 它读仓库里的 `data/operators.json` 当**干员白名单** → 必须排在国服抓取之后。
#    国服是周四 / 周五跑，周六跑正好能带上那一周新增的干员。
# ⚠️ 两块数据的**来源不同，别混**（2026-10-06 起）：
#    · **国服皮肤** 走 PRTS（`build:skins`）—— 只有那里有**复刻 / 下架窗口**，
#      而 UP 历史页的三角标记靠的就是「卡池窗口 ∩ 皮肤上架窗口」；
#    · **模组 / 密录（三服）+ en·tw 皮肤** 走**官方解包**（`build:gamedata --only=extras`）。
# ⚠️ Actions 的 cron 一律 UTC（北京 = UTC+8），13:17 → `17 5`。
#    与主工作流一样避开整点，并**同样前移**（2026-10-11）：平台自 2026-08-26 起定时任务
#    普遍迟到 5~7 小时，再按 18:17 排就会落到深夜。这条没有换池时效要求，**一场就够、
#    不需要主工作流那样的兜底场**（那边是怕错过当天 16:00 换的池）。
#    实测与对策 → `akGachaDocs/resource/定时任务延迟预研.md`。
"on":
  schedule:
    - cron: '17 5 * * 6'   # 6 = 周六
  workflow_dispatch:        # 也支持手动触发

permissions:
  contents: write               # 需要用 GITHUB_TOKEN 推送

# ⚠️ 与另外四条工作流**共用同一个并发组** → 互相串行，避免同时 push 撞车。
concurrency:
  group: data-fetch
  cancel-in-progress: false

jobs:
  update-extras:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai         # 让提交信息里的日期是北京时间
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 脚本 import 了 scripts/lib/http.mjs，那里要用 undici 包 → 必须装依赖。
      # 不需要 Python（本工作流不碰头像）。
      - name: 安装依赖
        run: npm ci

      # 只读公开的 PRTS Wiki，**不需要任何令牌**。
      # 数据没更新时脚本不会写盘、也不会动 generatedAt（见 fetch-skins.mjs）。
      #
      # ⚠️⚠️ **必须 `continue-on-error`**（2026-10-31 补上，之前漏了）：
      #    Actions 里每一步默认等价于 `if: success()` —— 前面一失败，**后面的步骤全部跳过**。
      #    2026-10-31 真的踩到：PRTS 一次 `fetch failed` 让这步挂掉，
      #    于是「官方解包 extras」那步**根本没跑**（用户报的就是这个），
      #    连提交都没发生 —— 明明两块数据来源不同、谁挂都不该牵连谁。
      #    现在：三步互不牵连，各自 continue-on-error；成功的部分照常提交，
      #    最后由末尾「汇总」步骤把 job 标红（想红但别丢数据）。
      - name: 抓取国服皮肤（PRTS Wiki）
        id: skins
        continue-on-error: true
        run: npm run build:skins

      # 官方解包：模组 / 密录（三服）+ en·tw 皮肤。自带 `data_version.txt` 短路，
      # 版本没变时只下几个几十字节的版本文件就返回。
      # ⚠️ `--only=extras` —— 中坚由主工作流负责，这里不重复跑。
      # ⚠️ `if: !cancelled()` 不能省：光有 `continue-on-error` 只表示「本步失败不算失败」，
      #    但**是否执行**仍取决于默认的 `success()` 条件。前面 skins 挂了就必须靠它照跑。
      - name: 抓取官方解包 extras（模组 / 密录 / en·tw 皮肤）
        id: extras
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run build:gamedata -- --only=extras

      # 本工作流会动到这几个文件（**不含**卡池与 metadata），所以只刷它们。
      # ⚠️ 同样要 `if: !cancelled()` —— 否则前面任何一步失败，抓到的那块数据就白抓了。
      #    无改动时 action 内部只打 notice、不会失败（见 commit-and-purge 的 diff 步骤）。
      - uses: ./.github/actions/commit-and-purge
        if: ${{ !cancelled() }}
        with:
          prefix: data(extras)
          purge-files: |
            skins_sc.json skins_en.json skins_tc.json
            memoirs_sc.json memoirs_en.json memoirs_tc.json
            modules_sc.json modules_en.json modules_tc.json

      # 汇总：任何一步真失败就把 job 标红。
      # ⚠️ 用 `steps.*.outcome` 而不是 `conclusion` —— 后者被 continue-on-error 抹成 success。
      # ⚠️ 只把 `failure` 当失败：`skipped`（例如 tokens 没配）不算。
      - name: 汇总各步骤结果
        if: ${{ !cancelled() }}
        env:
          OUT_SKINS: ${{ steps.skins.outcome }}
          OUT_EXTRAS: ${{ steps.extras.outcome }}
        run: |
          bad=0
          check() {
            if [ "$2" = "failure" ]; then
              echo "::error::$1 失败（数据已尽量提交，请到上面对应步骤看原因）"
              bad=1
            else
              echo "· $1：$2"
            fi
          }
          check "抓取国服皮肤（PRTS）" "$OUT_SKINS"
          check "抓取官方解包 extras" "$OUT_EXTRAS"
          exit "$bad"
