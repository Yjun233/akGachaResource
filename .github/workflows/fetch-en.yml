name: 抓取国际服数据（手动）

# 仅在 GitHub 网页上手动触发，不自动跑。
# 入口：仓库 → Actions → 「抓取国际服数据（手动）」→ Run workflow
"on":
  workflow_dispatch:

permissions:
  contents: write               # 需要用 GITHUB_TOKEN 推送

# ⚠️ 五条工作流（主更新 + 皮肤/密录/模组 + 三个单服）**共用同一个并发组** → 互相串行，
#    避免「手动触发」与「定时任务」同时 push 撞车（原先分属两个组，真会撞）。
concurrency:
  group: data-fetch
  cancel-in-progress: false

jobs:
  fetch-en:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai         # 让提交信息里的日期是北京时间
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install

      # 国际服（wiki.gg）。必须排在国服数据之后：它要读仓库里已有的
      # operators.json / banners_sc.json 来对齐 charId、中文名与「双五寻访」，
      # 并把 enName / enReleaseDate / enClassicDate 写回 operators.json。
      - name: 抓取卡池 / 干员数据（国际服 · wiki.gg）
        run: npm run build:data:en

      # 顺带把**官方解包数据**里的国际服中坚 + 模组 / 密录 / 皮肤也刷一遍（自带 data_version 短路）。
      - name: 抓取官方解包数据（国际服中坚 + 模组 / 密录 / 皮肤）
        continue-on-error: true
        run: npm run build:gamedata -- --servers en

      - name: 判断有没有实际变化
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::国际服数据无更新，不提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::检测到更新："
            git status --short
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data(en): $(date +%Y-%m-%d) 快照"
          git push

      # 单服抓取只刷新「本服会改动」的 json：国际服产 operators.json / banners_en.json / metadata.json。
      # 其余服的 json（banners_sc / banners_tc）不在本工作流产出范围，不刷。
      - name: 刷新 jsDelivr 缓存
        if: steps.diff.outputs.changed == 'true'
        run: |
          for f in operators.json metadata.json banners_en.json banners_cla_en.json \
                   modules_en.json memoirs_en.json skins_en.json; do
            body=$(curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/$f" || echo '{}')
            echo "purge data/$f -> $(echo "$body" | head -c 120)"
          done
