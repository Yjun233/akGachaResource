name: 更新数据与头像

# 每周二 / 周四 / 周五 的**北京时间 18:00** 跑一次。
# ⚠️ GitHub Actions 的 cron 一律用 UTC，北京时间 = UTC+8，所以 18:00 → `10` 点。
# ⚠️ 整点（:00）容易排队、实际执行可能晚几分钟到几十分钟。
#    若想错峰，把下面的 `0 10` 改成 `17 10`（即 18:17）之类。
# ⚠️ 这里给 `on` 加了引号：YAML 1.1 会把裸 `on` 解析成布尔 True，
#    某些严格的解析器会因此取不到键。GitHub 自己两种都认，但加上更稳。
"on":
  schedule:
    - cron: '17 10 * * 2,4,5'   # 周二=2 周四=4 周五=5
  workflow_dispatch:            # 也支持在网页上手动触发

permissions:
  contents: write               # 需要用 GITHUB_TOKEN 推送

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai         # 让提交信息里的日期是北京时间
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 头像要缩到 96×96，需要 Pillow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          npm install
          python -m pip install --upgrade pip
          pip install pillow

      # 数据没更新时脚本**不会写盘**、也不会动 generatedAt（见 fetch-data.mjs）
      - name: 抓取卡池 / 干员数据（国服）
        run: npm run build:data

      # 国际服（wiki.gg）。必须在国服之后：它要读国服的 operators.json / banners_sc.json
      # 来对齐 charId、中文名与「双五寻访」，并把 enName / enReleaseDate / enClassicDate
      # 写回 operators.json。同样只在内容变化时写盘。
      - name: 抓取卡池 / 干员数据（国际服）
        run: npm run build:data:en

      # 只补缺失的头像。CI 里能直连 raw.githubusercontent.com，
      # 所以把镜像列表置空、只走直连（本地跑时才用反代）。
      - name: 补齐干员头像
        env:
          AVATAR_MIRRORS: ''
        run: npm run build:avatars

      - name: 判断有没有实际变化
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::数据与头像均无更新，不提交、不刷新缓存"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::检测到更新："
            git status --short
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: $(date +%Y-%m-%d) 快照"
          git push

      # 站点在浏览器里经 jsDelivr CDN 读这些文件，不刷缓存会一直拿到旧的。
      # ⚠️ purge 接口是 **GET**，不是 POST —— 用 POST 会一律返回 405（实测）。
      - name: 刷新 jsDelivr 缓存
        if: steps.diff.outputs.changed == 'true'
        run: |
          for f in operators.json banners_sc.json banners_en.json metadata.json; do
            body=$(curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/$f" || echo '{}')
            echo "purge data/$f -> $(echo "$body" | head -c 120)"
          done
