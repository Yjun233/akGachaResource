name: 更新数据与头像

# 每周四 / 周五 的**北京时间 18:17** 跑一次。
# ⚠️ 2026-10-06 起**去掉了周二** —— 原先排周二纯粹是因为「国际服中坚寻访在周二轮换」，
#    而现在中坚已改由**官方解包数据**提供（`fetch-gamedata.mjs`）。那份数据里中坚池带的是
#    **未来的 `openTime`**（实测 master 上 en 最新已到下周），所以周四/周五跑就能提前拿到
#    下周二那一期，周二的必要性没有了。
# ⚠️ GitHub Actions 的 cron 一律用 UTC，北京时间 = UTC+8，所以 18:17 → `17 10`。
# ⚠️ 特意避开整点（:00 —— 整点容易排队、实际执行会晚几分钟到几十分钟）。
# ⚠️ 这里给 `on` 加了引号：YAML 1.1 会把裸 `on` 解析成布尔 True，
#    某些严格的解析器会因此取不到键。GitHub 自己两种都认，但加上更稳。
"on":
  schedule:
    - cron: '17 10 * * 4,5'   # 周四=4 周五=5（周二=2 已于 2026-10-06 去掉）
  workflow_dispatch:            # 也支持在网页上手动触发

permissions:
  contents: write               # 需要用 GITHUB_TOKEN 推送

# ⚠️ 与另外四条工作流（皮肤/密录/模组 + 三个单服手动）**共用同一个并发组** →
#    互相串行，避免「手动触发」与「定时任务」同时 push 撞车。
concurrency:
  group: data-fetch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai         # 让提交信息里的日期是北京时间
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 头像要缩到 96×96，需要 Pillow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install pillow

      # 干员剧情线（`actLine`）与单六寻访复刻判定（`rerunKind` / `canRerun`）**只在周五算**：
      # 它们要读 33MB 解包表，变化又很慢；不算的那几次由脚本**从上次快照回填**（见 fetch-data.mjs）。
      # ⚠️ 2026-10-08 起这两项都是**纯官方解包**（不再抓 PRTS 活动页）。
      # 手动触发时一律算（临时想刷新时方便）。TZ 已设成 Asia/Shanghai，所以 date 就是北京时间。
      - name: 判断本轮要不要算「干员剧情线 / 单六寻访复刻」
        id: act
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%u)" = "5" ]; then
            echo "with=1" >> "$GITHUB_OUTPUT"
            echo "::notice::本轮会算干员剧情线（actLine）与单六寻访复刻判定（rerunKind / canRerun）"
          else
            echo "with=0" >> "$GITHUB_OUTPUT"
          fi

      # 数据没更新时脚本**不会写盘**、也不会动 generatedAt（见 fetch-data.mjs）
      - name: 抓取卡池 / 干员数据（国服）
        env:
          WITH_ACTIVITIES: ${{ steps.act.outputs.with }}
        run: npm run build:data

      # 头像跟国服放一起：国服的 operators.json 一落盘就顺手补齐缺失头像。
      # 只补缺失的头像。CI 里能直连 raw.githubusercontent.com，
      # 所以把镜像列表置空、只走直连（本地跑时才用反代）。
      # ⚠️ 头像失败不算致命（不影响数据正确性），用 continue-on-error 放行，
      #    不连累后续的国际服 / 提交 / 缓存刷新。
      - name: 补齐干员头像
        continue-on-error: true
        env:
          AVATAR_MIRRORS: ''
        run: npm run build:avatars

      # 国际服（wiki.gg）。必须在国服之后：它要读国服的 operators.json / banners_sc.json
      # 来对齐 charId、中文名与「双五寻访」，并把 enName / enReleaseDate / enClassicDate
      # 写回 operators.json。同样只在内容变化时写盘。
      # ⚠️ 即便国际服抓取失败，国服 + 头像的数据仍可正常提交，故用 continue-on-error 放行。
      - name: 抓取卡池 / 干员数据（国际服）
        continue-on-error: true
        run: npm run build:data:en

      # 繁中服的数据源是**金山文档在线表格**，靠 AirScript webhook 读（不再是本地 xlsx）。
      # 需要 AIRSCRIPT_TOKEN（脚本令牌，**半年过期**，到金山「脚本编辑器 → 脚本信息」里延期）。
      # 排在国服 / 国际服之后：它要读 banners_sc.json 反查中文名与卡池类型、读 banners_en.json 补 enName。
      # ⚠️ 令牌没配好时**跳过而不是失败**；即便令牌配了但抓取失败（金山配额打爆 / 令牌过期 /
      # 网络抖动），也用 `continue-on-error` 放行 —— 不让它连累后续的提交、推送与缓存刷新，
      # 否则 tc 一挂，国服 / 国际服 + 头像抓到的新数据也不会被提交。
      - name: 检查繁中服令牌是否已配置
        id: tc_ready
        env:
          HAS_TC_TOKEN: ${{ secrets.AIRSCRIPT_TOKEN }}
        run: |
          if [ -n "$HAS_TC_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 AIRSCRIPT_TOKEN，本轮跳过繁中服（金山文档）数据"
          fi

      - name: 抓取卡池数据（繁中服 · 金山文档）
        if: steps.tc_ready.outputs.ready == 'true'
        continue-on-error: true
        env:
          AIRSCRIPT_TOKEN: ${{ secrets.AIRSCRIPT_TOKEN }}
        run: npm run build:data:tc

      # ⚠️ 皮肤 / 密录 / 模组**不在本工作流里** —— 它已拆成独立工作流 `update-extras.yml`
      #    （每周六跑一次）。那三个数据集只做国服、与卡池无关，没必要跟着周四/周五跑。

      # 官方解包数据：**只补「常驻中坚寻访 + 中坚甄选」**（那两块 wiki 三个源都会漏写 / 记错进店位）。
      # ⚠️ 脚本**自带 `data_version.txt` 短路** —— 各服版本没变时只下 3 个几十字节的版本文件就返回，
      #    不会每次白拉 `character_table`（19MB）。
      # ⚠️ CI 里 `raw.githubusercontent.com` 可直连（本机那个 HTTP_PROXY 不在 runner 上），
      #    所以**不需要**设 `GAMEDATA_BASE`。
      # ⚠️ 排在国服 / 国际服 / 繁中服**之后**：它读 `operators.json` 当 extras 的干员白名单。
      - name: 抓取官方解包数据（中坚 + 模组 / 密录 / 皮肤）
        continue-on-error: true
        run: npm run build:gamedata

      # 本工作流会动到这些文件 → 交给共用 action 判断变化、提交、刷新 CDN。
      # ⚠️ 清单要覆盖**本工作流会改动的每一份** data/*.json：
      #    · 国服脚本产 operators.json / banners_sc.json / metadata.json；
      #    · 国际服 / 繁中服脚本产 banners_{en,tc}.json 并写回 operators.json / metadata.json；
      #    · gamedata 产 banners_cla_*.json 与（`--only=all` 含 extras）skins_en/tc、memoirs_*、modules_*；
      #    · 头像 `npm run build:avatars` 产 avatars/**（不走 CDN purge，是图片文件）。
      #    （sc 皮肤不在此列 —— 它由 update-extras.yml 的 build:skins 负责刷新。）
      - uses: ./.github/actions/commit-and-purge
        with:
          prefix: data
          purge-files: |
            operators.json metadata.json
            banners_sc.json banners_en.json banners_tc.json
            banners_cla_sc.json banners_cla_en.json banners_cla_tc.json
            modules_sc.json modules_en.json modules_tc.json
            memoirs_sc.json memoirs_en.json memoirs_tc.json
            skins_en.json skins_tc.json
